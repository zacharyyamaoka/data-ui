<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame fixture</title>
<!-- tests/browser/frame_checks.py: a host shaped like robotparts.dev's category page (a header, a filter rail, a results
     pane that scrolls on its own; or, with ?window, one page scroll), so the frame= checks measure a real layout.
     ?frame=<name> sets the attribute before the kit starts. Served from the repo root (dist/ and gallery/). -->
<link rel="stylesheet" href="/dist/data-ui.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px system-ui, sans-serif; background: var(--data-bg, #fff); }
  header { flex: none; height: 60px; border-bottom: 1px solid #ddd; padding: 0 16px; line-height: 60px; }
  main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  aside { overflow-y: auto; border-right: 1px solid #ddd; padding: 8px; }
  #pane { overflow-y: auto; padding: 4px 20px 0; min-width: 0; --data-bleed: 20px; }
  body.window { height: auto; display: block; }
  body.window main { display: block; }
  body.window #pane { overflow: visible; }
  /* as robotparts: under 768 px the window scrolls, not the pane */
  @media (max-width: 767px) { body { height: auto; display: block; } main { display: block; } #pane { overflow: visible; } }
  .after { height: 1400px; }  /* taller than the viewport, so the end-of-page check scrolls the table past the band */
</style>
<script type="module" src="/dist/data-ui.js"></script>
</head>
<body>
<header>host header</header>
<main>
  <aside>the host's rail</aside>
  <div id="pane">
    <h1>Actuators</h1>
    <p>An intro paragraph the page scrolls away under a page frame.</p>
    <data-views id="v" src="/gallery/examples/robotparts-actuators/views.base" no-url></data-views>
    <h2>What the columns mean</h2>
    <p class="after">Content after the views.</p>
  </div>
</main>
<script>
  // before the module runs (it is deferred), so the element starts in its frame
  const q = new URLSearchParams(location.search);
  if (q.has('window')) document.body.classList.add('window');
  if (q.get('frame')) document.getElementById('v').setAttribute('frame', q.get('frame'));
</script>
</body>
</html>

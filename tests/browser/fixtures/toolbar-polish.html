<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toolbar polish fixture</title>
<!-- tests/browser/toolbar_polish_checks.py: a host shaped like robotparts.dev's category page under the Mix (release
     2026.10.26.12: toolbar="bar" views="auto" filters="pills rail" display="panel" selectable, frame="bleed"), where
     the open view's tab was drawn under the bar's TAB_MIN and the query box's suggestions cut their names. The header,
     the filter column (a linked <data-facets>, folded away under 768 px), the results pane with its bleed padding, and
     robotparts' body font. Served from the repo root (dist/ and gallery/). -->
<link rel="stylesheet" href="/dist/data-ui.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font: 14px/1.45 system-ui, sans-serif; background: var(--data-bg, #fff); color: var(--data-fg, #111); }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  header { flex: none; height: 60px; border-bottom: 1px solid #8884; padding: 0 16px; line-height: 60px; }
  main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); }
  aside { width: 17.5rem; overflow-y: auto; border-right: 1px solid #8884; padding: 4px 14px 24px; }
  #pane { overflow-y: auto; padding: 4px 20px 0; min-width: 0; }
  data-views { --data-bleed: 20px; }
  /* as robotparts: under 768 px the window scrolls, the filter column folds away and the pane takes 12 px sides */
  @media (max-width: 767px) {
    body { height: auto; display: block; overflow: visible; } main { display: block; padding: 0 12px; } aside { display: none; }
    #pane { overflow: visible; padding: 4px 0 0; } data-views { --data-bleed: 12px; }
  }
</style>
<script type="module" src="/dist/data-ui.js"></script>
</head>
<body>
<header>host header</header>
<main>
  <aside><data-facets for="v"></data-facets></aside>
  <div id="pane">
    <h1>Actuators</h1>
    <data-views id="v" src="/tests/browser/fixtures/toolbar-polish.base" no-url frame="bleed" toolbar="bar" views="auto" filters="pills rail" display="panel" selectable></data-views>
  </div>
</main>
</body>
</html>

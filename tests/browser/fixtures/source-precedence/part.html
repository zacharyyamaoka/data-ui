<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source precedence fixture</title>
<!-- tests/browser/source_precedence_checks.py: a made-up part's datasheet (part.json: four sources, conflicts, a private
     source with no public URL) under <data-views>, its state in the URL (docs/CONTRACT.md §36). Served from the repo
     root, so the kit is /dist/. ?toolbar=full|bar picks the toolbar; ?src=contact.base the CRM contact. -->
<link rel="stylesheet" href="/dist/data-ui.css">
<style>
  body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: var(--data-bg, #fff); color: var(--data-fg, #111); }
  :root[data-theme="dark"] body { background: #111; color: #eee; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #111; color: #eee; } }
  data-views { height: 640px; }
</style>
<script type="module">
  import * as kit from '/dist/data-ui.js';
  await import('/dist/sources.js');
  window.kit = kit;
  const q = new URLSearchParams(location.search);
  const v = document.createElement('data-views');
  v.id = q.get('id') || 'part';
  v.setAttribute('toolbar', q.get('toolbar') || 'bar');
  if (q.get('toolbar') !== 'full') { v.setAttribute('views', 'tabs'); v.setAttribute('filters', 'pills'); }
  v.setAttribute('src', q.get('src') || 'part.base');
  document.body.append(v);
  window.v = v;
  window.kitReady = true;
</script>
</head>
<body>
</body>
</html>

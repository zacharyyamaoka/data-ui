     draws itself (boards/), the dashboard a reader adds to from its own panel (self.base) and a plain <data-views> over
     a recording (recorded.base). Served from the repo root by the checks' own server, so the kit is /dist/. -->
<link rel="stylesheet" href="/dist/data-ui.css">
<style>
  body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  data-dashboard { display: block; margin-bottom: 24px; }
</style>
<script type="module">
  import * as kit from '/dist/data-ui.js';
  await import('/dist/dashboard.js');
  window.kit = kit;
  window.kitReady = true;
</script>
</head>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspector fixture</title>
<!-- tests/browser/inspector_checks.py. Served from the repo root, so the kit is /dist/. ?src= the .base; ?toolbar=; ?accept=1 gives the page
     an acceptProperty hook; ?persist=1 a persistView hook that keeps the file's text in sessionStorage and loads it on a reload;
     ?extra=1 a peekExtra. -->
<link rel="stylesheet" href="/dist/data-ui.css">
<style>
  body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: var(--data-bg, #fff); color: var(--data-fg, #111); }
  :root[data-theme="dark"] body { background: #111; color: #eee; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #111; color: #eee; } }
  data-views { height: 820px; }
</style>
<script type="module">
  import * as kit from '/dist/data-ui.js';
  await import('/dist/sources.js');
  await import('/dist/resize.js').catch(() => {});
  window.kit = kit;
  const q = new URLSearchParams(location.search);
  const v = document.createElement('data-views');
  v.id = 'insp';
  v.setAttribute('toolbar', q.get('toolbar') || 'full');
  if (q.get('accept')) {
    window.properties = [];
    v.acceptProperty = async (change) => { window.properties.push(change); return { ok: true, property: change.label ? change.label.toLowerCase() : undefined }; };
  }
  if (q.get('extra')) v.peekExtra = (row) => `<p class="host-foot">Host foot for ${row.id}</p>`;
  if (q.get('persist')) {
    window.saved = [];
    v.persistView = async (change) => { window.saved.push(change); sessionStorage.setItem('base', change.text); return { ok: true }; };
  }
  const kept = q.get('persist') ? sessionStorage.getItem('base') : null;
  if (kept) {
    const data = await (await fetch('parts.json')).json();
    v.base = kit.parseBase ? kit.parseBase(kept) : JSON.parse(kept);
    v.data = data;
  } else v.setAttribute('src', q.get('src') || 'parts.base');
  document.body.append(v);
  window.v = v;
  window.kitReady = true;
</script>
</head>
<body>
</body>
</html>

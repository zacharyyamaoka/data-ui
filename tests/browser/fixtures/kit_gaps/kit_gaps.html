<title>Kit gaps fixture</title>
<!-- tests/browser/kit_gaps_checks.py: an empty page the checks fill with <data-dashboard> and <data-views> elements over
     this folder's .base files (some read the robotics cases' own files, ../../../../gallery/examples/robotics-*/).
     Served from the repo root, so the kit is /dist/. WHY no display rule on data-views: the element is a flex column
     (core.css); a page that sets display: block on it breaks its layout (p1b.html, p2.html). -->
<link rel="stylesheet" href="/dist/data-ui.css">
<style>
  body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #eee; } }
  data-views.boxed { height: 420px; margin-bottom: 16px; }
  @media (max-width: 500px) { body { padding: 8px; } data-views.boxed { height: 380px; } }
</style>
<script type="module">
  import * as kit from '/dist/data-ui.js';
  await import('/dist/dashboard.js');
  window.kit = kit;
  window.kitReady = true;
</script>
</head>

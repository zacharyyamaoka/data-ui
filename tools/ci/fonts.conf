<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CI's default fonts: Noto Sans, as on the machine the layout checks were written on (docs/CI.md). A runner's default sans is a
     CJK face, wider than Noto, and a 390 px layout check reads the difference as an overflow. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
